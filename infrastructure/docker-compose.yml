# Local development services. Ports are offset (5433, 6380) so they don't clash
# with a Postgres or Redis already installed on the host.
#
#   npm run infra:up                                   # Postgres + Redis only (normal dev)
#   npm run app:up                                     # whole stack in containers on :8080
#   npm run app:logs / npm run app:down                # follow API logs / stop it
name: studywidbuddy

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: studywidbuddy
      POSTGRES_PASSWORD: studywidbuddy
      POSTGRES_DB: studywidbuddy
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U studywidbuddy']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: [app]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    # Database (Supabase or other hosted Postgres), AI keys, SMTP and GitHub settings come from
    # the API's own .env, so `npm run app:up` runs the same configuration as `npm run dev:api`.
    # DATABASE_URL/DIRECT_URL there must be reachable from a container (a hosted database, not localhost).
    env_file:
      - ../apps/api/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      WEB_ORIGIN: http://localhost:8080
      API_PUBLIC_URL: http://localhost:8080
      REDIS_URL: redis://redis:6379
      # The GitHub App key is mounted below; a Windows path from .env doesn't exist in the container.
      GITHUB_APP_PRIVATE_KEY_PATH: /secrets/studywidbuddy-github.pem
    volumes:
      # Folder holding the GitHub App .pem (outside the repo). Override with GITHUB_PEM_DIR.
      - ${GITHUB_PEM_DIR:-${USERPROFILE:-~}/.secrets}:/secrets:ro
    depends_on:
      redis:
        condition: service_healthy

  web:
    profiles: [app]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  pgdata:
